<style>
  :root {
    --bg:       #faf7f0;
    --bg-alt:   #edeae4;
    --cream:    #fcf7eb;
    --bone:     #f4ede0;
    --white:    #ffffff;
    --ink:      #1c2e4a;
    --ink-light:#2e4060;
    --ink-dim:  #8a8a8a;
    --border:   #d8d4cd;
    --banner:   #1e3452;
    --amber:    #b8682a;
    --amber-mid:#9a5620;
    --amber-pale:#f5e6d4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  .site-header {
    background: var(--banner);
    border-bottom: 2px solid rgba(184,104,42,0.6);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 40px;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px 16px;
  }
  .site-name {
    font-family: 'Newsreader', serif;
    font-size: 22px;
    font-weight: 700;
    color: rgba(255,255,255,0.92);
    text-decoration: none;
    letter-spacing: -0.3px;
  }
  .site-name em {
    font-style: normal;
    color: var(--amber);
  }
  nav { display: flex; gap: 28px; align-items: center; }
  nav a {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0px;
    text-transform: none;
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    transition: color 0.2s, opacity 0.2s;
  }
  nav a:hover { color: rgba(255,255,255,1); }
  .nav-current {
    color: rgba(255,255,255,1) !important;
    font-weight: 600;
    pointer-events: none;
  }
  .nav-tracker {
    color: rgba(255,255,255,1) !important;
    border: 1px solid rgba(255,255,255,0.4);
    padding: 5px 13px;
    border-radius: 3px;
    transition: border-color 0.2s !important;
  }
  .nav-tracker:hover {
    border-color: rgba(255,255,255,1) !important;
  }

  /* ── HERO ── */
  .hero {
    background: var(--white);
    padding: 88px 40px 96px;
    border-bottom: 1px solid var(--border);
  }
  .hero-inner {
    max-width: 1200px;
    margin: 0 auto;
  }
  .hero-left {
    max-width: 1100px;
  }
  .hero-statement { max-width: 680px; }
  .hero-kicker {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.9px;
    text-transform: uppercase;
    color: var(--amber-mid);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .hero-kicker::before {
    content: '';
    display: inline-block;
    width: 28px;
    height: 1px;
    background: var(--amber);
  }
  .hero h1 {
    font-family: 'Newsreader', serif;
    font-size: clamp(42px, 5vw, 66px);
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.5px;
    margin-bottom: 28px;
    color: var(--ink);
  }
  @media (min-width: 760px) { .hero h1 { white-space: nowrap; } }
  .hero h1 em {
    font-style: italic;
    color: var(--amber);
  }
  .hero-statement {
    font-family: 'Newsreader', serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(32px, 3.6vw, 46px);
    line-height: 1.2;
    color: var(--amber);
    margin: 36px 0 36px;
    max-width: 740px;
    letter-spacing: -0.3px;
  }
  .hero-emph { color: var(--ink); font-weight: 600; white-space: nowrap; font-size: 24px; }
  @media (max-width: 600px) { .hero-emph { white-space: normal; font-size: inherit; } }
  .hero-positioning {
    font-family: 'Newsreader', serif;
    font-size: 26px;
    line-height: 1.35;
    color: var(--ink);
    margin: 0 0 44px;
    max-width: none;
    border-left: 3px solid var(--amber);
    padding-left: 18px;
  }
  @media (min-width: 720px) { .hero-positioning { white-space: nowrap; } }
  @media (max-width: 600px) { .hero-positioning { font-size: 20px; } }
  .hero-positioning em { font-style: italic; color: var(--amber); }
  @media (max-width: 600px) {
    .hero-statement {
      font-size: 28px;
      margin: 12px 0 32px;
    }
  }
  .hero-body {
    font-family: 'Newsreader', serif;
    font-size: 22px;
    line-height: 1.65;
    color: var(--ink-light);
    max-width: 1080px;
    margin-bottom: 12px;
    text-wrap: pretty;
  }
  .hero-body-emphasis {
    color: var(--ink);
    font-size: 22px;
    line-height: 1.5;
    margin-top: 28px;
    margin-bottom: 28px;
  }
  @media (max-width: 600px) {
    .hero-body-emphasis {
      font-size: 20px;
      margin-top: 20px;
      margin-bottom: 20px;
    }
  }
  @media (max-width: 600px) {
    .hero-body { font-size: 17px; }
  }
  .hero-actions { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .btn-primary {
    background: var(--amber);
    color: var(--white);
    text-decoration: none;
    padding: 12px 26px;
    font-size: 14px;
    font-weight: 500;
    border-radius: 3px;
    transition: background 0.2s;
    font-family: 'Inter', sans-serif;
  }
  .btn-primary:hover { background: var(--amber-mid); }

  /* Hero right — tracker mini preview */
  .tracker-preview {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .tp-header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .tp-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .tp-live {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--amber-mid);
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .tp-live::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--amber);
    display: inline-block;
  }
  .tp-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid var(--border);
  }
  .tp-stat {
    padding: 20px 20px;
    border-right: 1px solid var(--border);
  }
  .tp-stat:last-child { border-right: none; }
  .tp-stat-value {
    font-family: 'Newsreader', serif;
    font-size: 30px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 4px;
  }
  .tp-stat-value.amber { color: var(--amber); }
  .tp-stat-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .tp-events { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .tp-event {
    background: var(--white);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 4px;
    padding: 12px 14px;
  }
  .tp-event.commitment { border-left-color: #2a7a4a; }
  .tp-event.announcement { border-left-color: var(--amber); }
  .tp-event.milestone { border-left-color: #8a8a8a; border-left-style: dashed; }
  .tp-event-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }
  .tp-event-title {
    font-family: 'Newsreader', serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
  }
  .tp-event-amount {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    margin-left: 12px;
  }
  .tp-event-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.5px;
    color: var(--ink-dim);
  }
  .tp-footer {
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    text-align: center;
  }
  .tp-footer a {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--amber-mid);
    text-decoration: none;
  }
  .tp-footer a:hover { text-decoration: underline; }

  /* ── SECTIONS ── */
  .section { padding: 48px 40px; }
  .section-inner { max-width: 1200px; margin: 0 auto; }
  .section-divider {
    border: none;
    border-top: 1px solid var(--border);
    max-width: 1200px;
    margin: 0 auto;
  }
  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--amber-mid);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-label::before {
    content: '';
    display: inline-block;
    width: 24px; height: 1px;
    background: var(--amber);
  }
  .section-num { font-family: 'IBM Plex Mono', monospace; font-weight: 500; color: var(--amber); }
  h2 {
    font-family: 'Newsreader', serif;
    font-size: clamp(26px, 3vw, 36px);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.3px;
    margin-bottom: 28px;
  }

  /* ── MISSION ── */
  .mission-section { background: var(--bg); }

  /* ── PRINCIPLES ── */
  .principles-section { background: var(--white); }
  .reform-history-section {
    background: var(--white);
    padding: 80px 40px;
    border-top: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .capitol-photo {
    position: absolute;
    inset: 0;
    background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/Capitol_Building_Full_View.jpg/1920px-Capitol_Building_Full_View.jpg');
    background-size: cover;
    background-position: center 60%;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease-out;
    z-index: 0;
    /* Soften the photo so text stays readable */
    filter: grayscale(40%) contrast(0.9);
  }
  .capitol-photo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, var(--white) 0%, rgba(255,255,255,0.55) 50%, var(--white) 100%);
  }
  .capitol-photo.visible { opacity: 0.32; }
  .reform-history-section .section-inner { position: relative; z-index: 1; }
  .reform-landing {
    font-weight: 500;
    color: var(--ink);
    border-top: 1px solid var(--border);
    padding-top: 20px;
    margin-top: 28px !important;
  }
  @media (max-width: 600px) {
    .capitol-photo.visible { opacity: 0.28; }
  }
  .reform-history-eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--amber-mid);
    margin-bottom: 28px;
  }
  .reform-history-prose p {
    font-family: 'Newsreader', serif;
    font-size: 20px;
    line-height: 1.7;
    color: var(--ink);
    max-width: 780px;
    margin-bottom: 20px;
  }
  .reform-pullquote {
    margin: 32px 0;
    padding: 24px 32px;
    border-left: 3px solid var(--amber);
    font-family: 'Newsreader', serif;
    font-style: italic;
    font-size: 20px;
    line-height: 1.5;
    color: var(--ink);
    max-width: 760px;
  }
  .reform-pullquote cite {
    display: block;
    margin-top: 14px;
    font-family: 'Inter', sans-serif;
    font-style: normal;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
    color: var(--ink-light);
  }
  @media (max-width: 600px) {
    .reform-pullquote { padding: 16px 20px; font-size: 17px; }
  }
  .reform-history-prose p:last-child {
    margin-bottom: 0;
    color: var(--ink);
    font-style: italic;
  }
  @media (max-width: 600px) {
    .reform-history-section { padding: 56px 20px; }
    .reform-history-prose p { font-size: 16px; line-height: 1.65; }
  }
  /* ── ACADEMIC FOOTNOTES ── */
  .fn {
    font-size: 0.7em;
    line-height: 0;
    position: relative;
    margin-left: 1px;
    vertical-align: super;
  }
  .fn a {
    color: var(--amber);
    font-weight: 600;
    text-decoration: none;
    padding: 0 2px;
    border-radius: 2px;
    transition: background 0.15s;
  }
  .fn a:hover {
    background: rgba(184,104,42,0.12);
  }
  .fn-tip {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: #f5f2ed;
    padding: 8px 12px;
    border-radius: 4px;
    font-family: 'Newsreader', serif;
    font-size: 13px;
    font-weight: 400;
    font-style: italic;
    line-height: 1.4;
    width: max-content;
    max-width: 280px;
    white-space: normal;
    text-align: left;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 10;
    box-shadow: 0 4px 12px rgba(28,46,74,0.18);
  }
  .fn-tip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--ink);
  }
  .fn:hover .fn-tip {
    opacity: 1;
  }
  @media (max-width: 720px) {
    /* On touch devices, tap goes to source instead of showing tip */
    .fn-tip { display: none; }
  }

  .section-supplement a {
    color: var(--ink);
    text-decoration: underline;
    text-decoration-color: var(--amber);
    text-underline-offset: 3px;
  }
  .section-supplement a:hover {
    color: var(--amber);
  }
  .section-supplement {
    font-family: 'Newsreader', serif;
    font-size: 20px;
    line-height: 1.65;
    color: var(--ink-light);
    max-width: 740px;
    margin: 24px 0 16px;
    text-wrap: pretty;
  }
  .section-supplement strong {
    color: var(--ink);
    font-weight: 600;
  }

  .right-section {
    background: var(--bg);

  }

<script>
// ── NEWSLETTER FORM (placeholder handler) ──
(function() {
  const form = document.getElementById('newsletterForm');
  const thanks = document.getElementById('newsletterThanks');
  if (!form || !thanks) return;
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = form.querySelector('input');
    const button = form.querySelector('button');
    const email = input.value.trim();
    if (!email) return;
    button.disabled = true;
    const originalLabel = button.textContent;
    button.textContent = 'Subscribing…';
    try {
      await fetch('https://script.google.com/macros/s/AKfycbx996LofuZ6IPGdVJ4MtqYq6SJBK2OzXJ1fro6Wvr1bHulzDftMVn7kdGpaDa9KgAmK/exec', {
        method: 'POST',
        mode: 'no-cors',
        body: new URLSearchParams({ email: email })
      });
      form.style.display = 'none';
      thanks.classList.add('show');
    } catch (err) {
      button.disabled = false;
      button.textContent = originalLabel;
      thanks.textContent = 'Something went wrong. Try again, or email daniel@thenewforeignassistance.org';
      thanks.classList.add('show');
    }
  });
})();
</script>



<script>
// Watermark fade-in/fade-out on scroll for both USAID and Capitol watermarks
(function() {
  const targets = [
    { sectionId: 'rightSection', markClass: '.usaid-watermark' },
    { sectionId: 'reformSection', markClass: '.capitol-photo' }
  ];
  const items = targets
    .map(t => {
      const s = document.getElementById(t.sectionId);
      if (!s) return null;
      const m = s.querySelector(t.markClass);
      return m ? { s, m } : null;
    })
    .filter(Boolean);
  if (!items.length) return;
  function update() {
    const vh = window.innerHeight;
    for (const { s, m } of items) {
      const rect = s.getBoundingClientRect();
      const sectionMid = rect.top + rect.height / 2;
      const distance = Math.abs(sectionMid - vh / 2);
      const maxDistance = vh / 2 + rect.height / 2;
      const proximity = 1 - Math.min(distance / maxDistance, 1);
      if (proximity > 0.15) m.classList.add('visible');
      else m.classList.remove('visible');
    }
  }
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
})();
</script>
